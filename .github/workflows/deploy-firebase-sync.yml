name: Deploy firebase-sync (Cloud Run)

on:
  push:
    branches:
      - main
      - beta
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-firebase-sync-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_NAME: firebase-sync
  REGION: us-central1
  GAR_REPOSITORY: cloud-run
  NX_NO_CLOUD: true
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID != '' && secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT != '' && secrets.GCP_DEPLOYER_SERVICE_ACCOUNT || vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.8.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build firebase-sync
        run: pnpm exec nx build firebase-sync --configuration=production

      - name: Validate GCP auth inputs
        run: |
          if [ -z "${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]; then
            echo "Missing GCP_WORKLOAD_IDENTITY_PROVIDER (set as repo secret or variable)."
            exit 1
          fi

          if [ -z "${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}" ]; then
            echo "Missing GCP_DEPLOYER_SERVICE_ACCOUNT (set as repo secret or variable)."
            exit 1
          fi

          if [ -z "${{ env.GCP_PROJECT_ID }}" ]; then
            echo "Missing GCP_PROJECT_ID (set as repo secret or variable)."
            exit 1
          fi

      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail
          echo "Provider configured in workflow: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}"

          AUDIENCE="https://iam.googleapis.com/${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "Missing GitHub OIDC request environment variables."
            exit 1
          fi

          OIDC_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}"
          TOKEN_RESPONSE="$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${OIDC_URL}")"
          ID_TOKEN="$(echo "$TOKEN_RESPONSE" | jq -r '.value')"

          if [ -z "$ID_TOKEN" ] || [ "$ID_TOKEN" = "null" ]; then
            echo "Failed to acquire OIDC token from GitHub Actions."
            echo "$TOKEN_RESPONSE"
            exit 1
          fi

          PAYLOAD_B64="$(echo "$ID_TOKEN" | cut -d '.' -f2 | tr '_-' '/+')"
          PAYLOAD_JSON="$(echo "$PAYLOAD_B64" | base64 -d 2>/dev/null || true)"

          if [ -z "$PAYLOAD_JSON" ]; then
            echo "Failed to decode JWT payload."
            exit 1
          fi

          echo "OIDC claim summary:"
          echo "$PAYLOAD_JSON" | jq '{sub, repository, repository_owner, ref, event_name, workflow_ref, aud}'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Ensure Artifact Registry exists
        run: |
          gcloud artifacts repositories describe "${{ env.GAR_REPOSITORY }}" \
            --location="${{ env.REGION }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
          || gcloud artifacts repositories create "${{ env.GAR_REPOSITORY }}" \
            --repository-format=docker \
            --location="${{ env.REGION }}" \
            --project="${{ env.GCP_PROJECT_ID }}"

      - name: Build and push image with Cloud Build
        env:
          IMAGE_URI: ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          gcloud builds submit \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --tag "$IMAGE_URI" \
            --file apps/firebase-sync/Dockerfile \
            .

      - name: Deploy to Cloud Run
        env:
          IMAGE_URI: ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --image "$IMAGE_URI" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --port=8080 \
            --set-env-vars=NODE_ENV=production
